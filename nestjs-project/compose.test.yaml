services:
  tests:
    image: streamtube-api:phase03
    profiles: [test]
    env_file: .env
    environment:
      NODE_ENV: test
      DB_NAME: streamtube_test
      DB_DATABASE: streamtube_test
      STORAGE_BUCKET: streamtube-test
      STORAGE_PUBLIC_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    command: ["sh", "scripts/test-all.sh"]
